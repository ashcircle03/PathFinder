apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: pathfinder
  labels:
    app: pathfinder
    component: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Minikube uses default storageClass (standard)
  # storageClassName: standard
