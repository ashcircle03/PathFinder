apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: pathfinder
  labels:
    app: pathfinder
    component: frontend
spec:
  type: NodePort
  selector:
    app: pathfinder
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
