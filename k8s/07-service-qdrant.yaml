apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: pathfinder
  labels:
    app: pathfinder
    component: qdrant
spec:
  type: ClusterIP
  selector:
    app: pathfinder
    component: qdrant
  ports:
  - name: http
    port: 6333
    targetPort: 6333
    protocol: TCP
  - name: grpc
    port: 6334
    targetPort: 6334
    protocol: TCP
