apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: pathfinder
  labels:
    app: pathfinder
    component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pathfinder
      component: ollama
  template:
    metadata:
      labels:
        app: pathfinder
        component: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: http
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        livenessProbe:
          exec:
            command:
            - ollama
            - list
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - ollama
            - list
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-pvc
      # GPU 노드 선택 (레이블이 있는 경우)
      # nodeSelector:
      #   nvidia.com/gpu: "true"
