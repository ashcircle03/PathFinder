apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: pathfinder
  labels:
    app: pathfinder
    component: qdrant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Minikube uses default storageClass (standard)
  # storageClassName: standard
